  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- ===== HERO SLIDER (navbar + imagem num bloco só) ===== -->
<div class="hero-slider" id="hero-slider">

  <!-- SLIDES — troque os background-image no CSS pelos seus caminhos -->
  <div class="slide ativo"></div>
  <div class="slide"></div>
  <div class="slide"></div>

  <!-- NAVBAR (flutua sobre o slider) -->
  <nav class="navbar">
    <div class="nav-container container">

      <div class="menu-toggle" id="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <ul class="nav-links" id="nav-links">

      </ul>

  </nav>

  <!-- SETA ESQUERDA -->
  <button class="slider-arrow prev" id="prev" aria-label="Anterior">
    <i class="fa-solid fa-chevron-left"></i>
  </button>

  <!-- SETA DIREITA -->
  <button class="slider-arrow next" id="next" aria-label="Próximo">
    <i class="fa-solid fa-chevron-right"></i>
  </button>

  <!-- DOTS -->
  <div class="slider-dots" id="slider-dots"></div>
